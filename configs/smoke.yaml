# Small end-to-end configuration for verifying a local installation.
model:
  img_size: 32
  patch_size: 8
  in_channels: 3
  num_classes: 5
  embed_dim: 32
  depth: 1
  num_heads: 4
  mlp_ratio: 2.0
  dropout: 0.1
  attention_dropout: 0.1

data:
  root_dir: ./data
  generate_on_fly: true
  train_samples: 8
  val_samples: 12
  test_samples: 12
  batch_size: 4
  num_workers: 0
  pin_memory: false
  seed: 42

training:
  epochs: 1
  output_dir: ./experiments/smoke
  lr: 0.001
  weight_decay: 0.01
  min_lr: 0.00001
  mixed_precision: false
  early_stopping_patience: 3
  early_stopping_delta: 0.001
  resume_from: null

hardware:
  device: cpu
